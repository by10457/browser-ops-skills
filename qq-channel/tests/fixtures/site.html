<!doctype html><meta charset="utf-8"><style>.game-guild-main__waterfalls,.feed-content{height:260px;overflow:auto}.comment-list-item{padding:8px} .editor-area{padding:10px} [contenteditable]{min-height:50px;border:1px solid gray}</style>
<div class="app-login"><span class="name">global</span><img src="https://fixture.test/global.png"></div>
<div class="my-guild-list"><div class="my-guild-item router-link-active" title="channel"><img src="https://fixture.test/channel.png"><div class="item-name">channel</div></div></div>
<h1>channel</h1>
<div id="feed"><div class="tab-bar__item is-active"><h3>全部</h3></div><div class="tab-bar__item"><h3>热门</h3></div><div class="tab-bar__item"><h3>说说</h3></div><div class="game-guild-main__waterfalls"></div></div>
<div id="detail"><div class="guild-name">channel</div><div class="game-guild-detail-poster-userInfo"><div class="user-info__name-text">student</div><img src="https://fixture.test/student.png"></div><div class="feed-content"><div class="short-textcontent-container-full">hello campus</div><div class="feed-info__detail__time">2026-09-21</div><div class="feed-info__detail__from-name">说说</div><div class="comment-bar__comment-count">评论2</div><div class="comment-list"><div id="c_original" class="comment-list-item"><div class="comment-list-item__info__title"><img src="https://fixture.test/student.png"></div><div class="comment-list-item__info__title-name">student</div><div class="comment-richcontent">question</div><div class="comment-list-item__info__title-time">1小时前</div><div class="comment-list-item__rely"><span class="comment-list-item__rely-count">回复</span></div></div><div id="r_old" class="comment-list-item"><div class="comment-list-item__info__title"><img src="https://fixture.test/other.png"></div><div class="comment-list-item__info__title-name">other</div><div class="comment-richcontent">old reply</div></div></div><div class="has-no-more-comment">- 暂无更多评论 -</div></div><div class="bottom-input">发言要友善，畅聊不引战</div><div class="bottom-right"><div class="like-container" aria-pressed="false"><div class="like-text">点赞</div></div></div></div>
<div class="editor-area"><div class="editor-header"><div class="user-info"><img src="https://fixture.test/alias.png"><span class="user-name">alias</span></div><div class="placeholder-text"></div></div><div contenteditable="true" data-exeditor-root><p><span class="exeditor-placeholder-container" contenteditable="false">期待你的分享...</span><br class="ProseMirror-trailingBreak"></p></div><div class="preview-list"></div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><div class="word-count">0/1000</div><button class="chose-channel-btn">选择版块</button><div class="publish-button"><button disabled>发表</button></div></div>
<div class="plate" style="display:none"><div class="choice">说说</div></div>
<script>
const isPost=location.pathname.includes('/post/');document.querySelector(isPost?'#feed':'#detail').remove();
const editor=document.querySelector('[contenteditable]'),button=document.querySelector('.publish-button button'),replyLabel=document.querySelector('.placeholder-text');let replied=false;
if(isPost){document.querySelector('.editor-area').style.display='none';button.textContent='发送';}
function show(){document.querySelector('.editor-area').style.display='block';editor.focus();}
document.querySelector('.editor-header').onclick=show;
document.querySelector('.bottom-input')?.addEventListener('click',show);
document.querySelector('.comment-list-item__rely')?.addEventListener('click',()=>{replied=true;document.querySelector('.comment-list-item__rely-count').textContent='回复中';replyLabel.textContent='回复student：question';show();});
editor.oninput=()=>{editor.querySelector('.exeditor-placeholder-container')?.remove();editor.querySelector('.ProseMirror-trailingBreak')?.remove();button.disabled=!editor.textContent.trim();};
document.querySelector('.chose-channel-btn').onclick=()=>document.querySelector('.plate').style.display='block';
document.querySelector('.choice').onclick=()=>{document.querySelector('.chose-channel-btn').textContent='说说';document.querySelector('.plate').style.display='none';};
for(const tab of document.querySelectorAll('.tab-bar__item'))tab.onclick=()=>{document.querySelector('.is-active')?.classList.remove('is-active');tab.classList.add('is-active');history.replaceState(null,'','?subc='+encodeURIComponent(tab.textContent));};
document.querySelector('.my-guild-item').onclick=()=>location.href='/g/abc';
function card(id,name,txt){const a=document.createElement('a');a.className='game-guild-main__short-content';a.href='https://pd.qq.com/g/abc/post/'+id+'?subc=12';a.innerHTML='<div class="user-info"><img src="https://fixture.test/'+name+'.png"><span class="nick">'+name+'</span></div><span class="edit-time">刚刚</span><div class="game-guild-main__short-content__media-detail"></div>';a.querySelector('.game-guild-main__short-content__media-detail').textContent=txt;return a;}
if(!isPost)document.querySelector('.game-guild-main__waterfalls').append(card('B_target','student','hello campus'));
document.querySelector('.like-container')?.addEventListener('click',e=>{e.currentTarget.setAttribute('aria-pressed','true');e.currentTarget.querySelector('.like-text').textContent='已点赞';});
document.querySelector('input[type=file]').onchange=e=>{for(const f of e.target.files){const img=document.createElement('img');img.src='https://fixture.test/upload-'+document.querySelectorAll('.preview-list img').length+'.png';document.querySelector('.preview-list').append(img);}};
button.onclick=()=>{const txt=editor.innerText;if(isPost){const item=document.createElement('div');item.className='comment-list-item';item.id=(replied?'r_':'c_')+'new';item.innerHTML='<div class="comment-list-item__info__title"><img src="https://fixture.test/alias.png"></div><div class="comment-list-item__info__title-name">alias</div><div class="comment-richcontent"></div>';item.querySelector('.comment-richcontent').textContent=txt;document.querySelector('.comment-list').append(item);}else{const a=card('B_new','alias',txt);for(const img of document.querySelectorAll('.preview-list img')){const wrap=document.createElement('div');wrap.className='short-feed-image';wrap.append(img.cloneNode());a.append(wrap);}document.querySelector('.game-guild-main__waterfalls').prepend(a);}editor.textContent='';document.querySelector('.preview-list').textContent='';document.querySelector('input[type=file]').value='';button.disabled=true;};
</script>
